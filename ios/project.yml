name: KaeriTen
options:
  bundleIdPrefix: de.opqrco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  KaeriTen:
    type: application
    platform: iOS
    sources:
      - path: KaeriTen
    resources:
      - path: KaeriTen/Resources
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: KaeriTen
        PRODUCT_BUNDLE_IDENTIFIER: de.opqrco.kaeriten
        INFOPLIST_KEY_CFBundleDisplayName: kaeriTen
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Game Center実績機能に必要（docs/GAME_CENTER_ACHIEVEMENTS.md 参照）。
        CODE_SIGN_ENTITLEMENTS: KaeriTen/KaeriTen.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
  KaeriTenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaeriTenTests
    dependencies:
      - target: KaeriTen
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.opqrco.kaeriten.tests
        GENERATE_INFOPLIST_FILE: YES
        # KaeriTen.app内でホストされるユニットテストにする。
        # これにより Bundle.main が KaeriTen.app のバンドル（game.sqlite同梱）を指す。
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KaeriTen.app/KaeriTen"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  KaeriTen:
    build:
      targets:
        KaeriTen: all
        KaeriTenTests: [test]
    test:
      targets:
        - KaeriTenTests
    run:
      config: Debug
